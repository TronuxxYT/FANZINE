<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fanzine — sprite de ícones monocromáticos (24x24, traço em currentColor).
  Uso externo (páginas secundárias / outros componentes):

    <svg class="icon" aria-hidden="true">
      <use href="assets/icons/sprite.svg#i-check"></use>
    </svg>

  Em index.html o mesmo conjunto é embutido inline para funcionar também
  quando a página é aberta diretamente via file://.
  Ícones: i-strategy, i-interface, i-code, i-system, i-data, i-evolve,
  i-check, i-arrow, i-arrow-up, i-close, i-menu, i-chevron, i-quote,
  i-spark, i-shield, i-gauge, i-layers, i-users, i-clock, i-linkedin,
  i-github, i-instagram, i-mail, i-pin.
-->

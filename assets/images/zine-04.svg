    <text x="312" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#111111">Nº 02</text>
    <path d="M312 162h146M312 180h112M312 198h132" stroke="#9A9A9A" stroke-width="5" stroke-linecap="round"/>

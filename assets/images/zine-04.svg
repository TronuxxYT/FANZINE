  </defs>
  <rect width="600" height="400" rx="18" fill="#0A0A0A"/>
  <rect x="8" y="8" width="584" height="384" rx="12" fill="url(#z4bg)" stroke="#222222"/>
  <!-- caderno de trás -->
  <g transform="rotate(-5 210 210)">
    <rect x="120" y="120" width="180" height="190" rx="9" fill="#F0F0F0" stroke="#2A2A2A"/>
    <path d="M140 150h140M140 168h110M140 186h126" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>

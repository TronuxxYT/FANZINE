<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Manual Prático de Guerrilha para Criação de Fanzines">
  <defs>
    <linearGradient id="mhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="mhGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="mhSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#1F1F1F"/>
    </linearGradient>
  </defs>

  <rect width="720" height="560" rx="28" fill="url(#mhBg)"/>
  <g stroke="#1A1A1A" stroke-width="1">
    <path d="M0 140h720M0 280h720M0 420h720"/>
    <path d="M120 0v560M360 0v560M600 0v560"/>
  </g>

  <!-- Zine dobrado ao fundo (esquerda) -->
  <g transform="rotate(-7 210 380)">
    <rect x="110" y="250" width="204" height="272" rx="10" fill="#0D0D0D" stroke="#242424"/>
    <rect x="122" y="262" width="180" height="248" rx="6" fill="#111111" stroke="#2A2A2A"/>
    <path d="M212 262v248" stroke="#222222"/>
    <rect x="140" y="286" width="52" height="66" rx="4" fill="#1C1C1C"/>
    <rect x="140" y="368" width="120" height="8" rx="4" fill="#2E2E2E"/>
    <rect x="140" y="384" width="94" height="8" rx="4" fill="#232323"/>
    <rect x="232" y="300" width="52" height="8" rx="4" fill="#2E2E2E"/>
    <rect x="232" y="318" width="40" height="8" rx="4" fill="#232323"/>
  </g>

  <!-- Manual principal (centro/direita) -->
  <g>
    <rect x="298" y="118" width="44" height="360" rx="8" fill="url(#mhSpine)" stroke="#2A2A2A"/>
    <rect x="330" y="112" width="286" height="372" rx="12" fill="#141414" stroke="#303030"/>
    <rect x="334" y="116" width="278" height="364" rx="10" fill="url(#mhGlass)"/>
    <rect x="366" y="150" width="70" height="70" rx="18" fill="#0A0A0A" stroke="#333333"/>
    <path d="M392 166h22v9h-14v7h12v9h-12v13h-8z" fill="#FFFFFF"/>
    <circle cx="416" cy="169" r="2.4" fill="#BDBDBD"/>
    <rect x="366" y="248" width="212" height="15" rx="7" fill="#F2F2F2"/>
    <rect x="366" y="274" width="164" height="15" rx="7" fill="#CFCFCF"/>
    <rect x="366" y="306" width="120" height="9" rx="4" fill="#8C8C8C"/>
    <rect x="366" y="324" width="140" height="9" rx="4" fill="#6E6E6E"/>
    <rect x="366" y="352" width="196" height="1.5" fill="#2A2A2A"/>
    <rect x="366" y="368" width="98" height="26" rx="13" fill="#FFFFFF"/>
    <rect x="382" y="378" width="66" height="6" rx="3" fill="#111111"/>
    <rect x="366" y="416" width="90" height="8" rx="4" fill="#3A3A3A"/>
    <rect x="366" y="432" width="70" height="8" rx="4" fill="#2C2C2C"/>
  </g>

  <!-- Pocket zine à frente -->
  <g transform="rotate(6 520 470)">
    <rect x="428" y="404" width="188" height="128" rx="8" fill="#101010" stroke="#2A2A2A"/>
    <rect x="438" y="414" width="168" height="108" rx="5" fill="#161616" stroke="#303030"/>
    <path d="M522 414v108" stroke="#242424"/>
    <rect x="450" y="430" width="54" height="8" rx="4" fill="#D9D9D9"/>
    <rect x="450" y="446" width="40" height="8" rx="4" fill="#7A7A7A"/>
    <rect x="534" y="444" width="56" height="46" rx="4" fill="#1E1E1E"/>
  </g>

  <!-- Sombras de apoio -->
  <ellipse cx="256" cy="536" rx="150" ry="12" fill="#000000" opacity="0.55"/>
  <ellipse cx="472" cy="500" rx="170" ry="14" fill="#000000" opacity="0.6"/>
  <ellipse cx="524" cy="544" rx="110" ry="9" fill="#000000" opacity="0.5"/>

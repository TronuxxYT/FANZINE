    <linearGradient id="msFold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#050505" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="#D1D5DB"/>

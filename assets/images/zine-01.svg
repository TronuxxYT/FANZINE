<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Protótipo de fanzine dobrado a partir de uma folha A4">
  <defs>
    <linearGradient id="z1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" rx="18" fill="#0A0A0A"/>
  <rect x="8" y="8" width="584" height="404" rx="12" fill="url(#z1bg)" stroke="#222222"/>
  <!-- folha A4 aberta atrás -->
  <g transform="rotate(-3 300 210)">
    <rect x="150" y="70" width="300" height="300" rx="6" fill="#E8E8E8" stroke="#2A2A2A"/>
    <path d="M300 70v300M150 220h300" stroke="#B5B5B5" stroke-width="1.6" stroke-dasharray="4 6"/>
    <text x="162" y="92" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E6E">PÁG. 1 · CAPA</text>
    <text x="312" y="92" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E6E">PÁG. 8 · CONTRA</text>
    <text x="162" y="242" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E6E">PÁG. 2</text>
    <text x="312" y="242" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E6E">PÁG. 7</text>
    <path d="M162 116h120M312 116h120" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>
    <path d="M162 266h110M312 266h126" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- zine dobrado na frente -->
  <g transform="rotate(5 320 260)">
    <rect x="210" y="120" width="220" height="200" rx="8" fill="#FAFAFA" stroke="#2A2A2A"/>
    <path d="M320 120v200" stroke="#C2C2C2" stroke-width="1.6"/>
    <text x="232" y="168" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#111111">MEU ZINE</text>
    <path d="M232 186h160M232 204h126" stroke="#9A9A9A" stroke-width="5" stroke-linecap="round"/>
    <rect x="232" y="228" width="160" height="62" rx="5" fill="#141414"/>
    <path d="M244 278l28-32 20 20 18-24 26 36z" fill="#5E5E5E"/>
    <circle cx="246" cy="244" r="8" fill="#6E6E6E"/>
    <text x="342" y="140" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6E6E6E">Nº 01</text>
  </g>
  <!-- indicador de dobra/corte -->
  <path d="M480 84v58" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M472 84h16M472 142h16" stroke="#3A3A3A" stroke-width="2"/>
  <text x="500" y="118" font-family="Arial, sans-serif" font-size="12" fill="#666666">1 corte</text>
  <text x="500" y="136" font-family="Arial, sans-serif" font-size="12" fill="#666666">2 dobras</text>
  <path d="M96 372h150" stroke="#2A2A2A" stroke-width="2"/>
  <text x="96" y="360" font-family="Arial, sans-serif" font-size="12" fill="#666666">8 páginas · 1 folha A4</text>
</svg>
